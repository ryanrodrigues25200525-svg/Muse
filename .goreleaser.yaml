version: 2

project_name: muse

builds:
  - id: muse
    main: ./main.go
    binary: mu
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/ryanrodrigues25200525-svg/Apple-music-cli/cmd.Version={{.Version}}

universal_binaries:
  - id: mu-darwin-universal
    ids:
      - muse
    replace: true

archives:
  - id: default
    ids:
      - mu-darwin-universal
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_universal"
    files:
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc

# Homebrew formula: maintained in this repository at Formula/muse.rb, not
# generated here. The former `brews` block pointed at the homebrew-tap repo,
# which no longer exists, and GoReleaser deprecated `brews` in v2.16 in favour
# of casks. This project installs a plain CLI binary, so the in-repo formula is
# the right mechanism; update its url and sha256 after each release.
